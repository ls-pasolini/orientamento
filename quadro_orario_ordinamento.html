
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadro orario - Liceo Scientifico</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px;
    background: #fff;
    color: #222;
    font-family: Arial, sans-serif;
  }

  h2 { text-align: center; }

  .table-container {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 550px;
  }

  th, td {
    padding: 12px;
    border: 1px solid #ddd;
    text-align: center;
  }

  th { background: #a71930; color: white; }

  td:first-child {
    text-align: left;
    font-weight: bold;
  }

  tr:nth-child(even) { background: #f5f5f5; }
</style>
</head>
<body>

<h2>Quadro orario - Liceo Scientifico</h2>

<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>Disciplina</th>
        <th>1°</th><th>2°</th><th>3°</th>
        <th>4°</th><th>5°</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Lingua e letteratura italiana</td>
        <td>4</td><td>4</td><td>4</td><td>4</td><td>4</td>
      </tr>
      <tr>
        <td>Matematica</td>
        <td>5</td><td>5</td><td>4</td><td>4</td><td>4</td>
      </tr>
      <tr>
        <td>Scienze naturali</td>
        <td>2</td><td>2</td><td>3</td><td>3</td><td>3</td>
      </tr>
    </tbody>
  </table>
</div>

</body>
</html>
